name: Build Starlight Mod

on:
  push:
    branches: [ "main" ]
  pull request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.daemon=false' 'org.gradle.parallel=false' 'org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC' > ~/.gradle/gradle.properties

      - name: Build with Gradle
        run: gradle build --no-daemon --no-parallel --stacktrace

      - name: List build outputs
        if: always()
        run: ls -lh build/libs || true

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: starlight-mod-jar
          path: build/libs/*.jar
